name: Build and deploy site

on:
  push:
    branches: ["master"]
  schedule:
    # 02:00 UTC daily. arXiv announces at 20:00 US Eastern, which is 00:00 UTC
    # (EDT) or 01:00 UTC (EST) the next day — 02:00 UTC leaves a ~1-2h buffer
    # after the announcement in either case, but still runs as early as
    # possible so a GitHub Actions scheduling delay (common, sometimes hours)
    # doesn't push the refresh too far into the morning.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch arXiv digest data
        run: |
          mkdir -p assets/data
          python3 scripts/fetch_arxiv.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
