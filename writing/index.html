---
layout: base
title: Writing
---
<section class="section">
  <div class="wrap narrow">
    <h1>Writing</h1>
    <ul class="post-list">
      {% for post in site.posts %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <span class="post-date">{{ post.date | date: "%B %-d, %Y" }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
